<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLB MTCT - TỔ TOÁN THCS QUẢN CƠ THÀNH</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    iframe { border: none; width: 100%; height: 100%; display: block; }
    
    /* Thiết kế nút Nổi */
    .home-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background-color: #2563eb; 
      color: white;
      padding: 10px 18px;
      border-radius: 50px;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 9999;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .home-btn:active { cursor: grabbing; }
  </style>
</head>
<body>
  
  <!-- Nút nổi -->
  <a href="https://thaykhai.github.io/" class="home-btn" id="dragBtn">
    🏠 Về Trang Chủ
  </a>

  <script>
    // ----------------------------------------------------
    // 1. NHÚNG GOOGLE APPS SCRIPT
    // ----------------------------------------------------
    const _0xlnk = "aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J3UENCNDROZHlLOGFuQUxOUmJSZWRqX2tkQmtwc2p1N1UybFM0Rm1lblBOZnU0aFpaV3dIX1FLMU94MENCb3pSN2ZVQS9leGVj"; 
    
    const frame = document.createElement("iframe");
    frame.src = atob(_0xlnk);
    frame.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture");
    frame.setAttribute("allowfullscreen", "");
    document.body.appendChild(frame);

    // ----------------------------------------------------
    // 2. CHỨC NĂNG KÉO THẢ NÚT VỀ TRANG CHỦ
    // ----------------------------------------------------
    const btn = document.getElementById("dragBtn");
    
    let isDragging = false;
    let isPressed = false;
    let offsetX = 0, offsetY = 0;

    // Ngăn chặn hành vi kéo link mặc định của trình duyệt
    btn.addEventListener("dragstart", (e) => e.preventDefault());

    // Khi người dùng bắt đầu nhấn chuột / chạm ngón tay
    const startDrag = (e) => {
      isPressed = true;
      isDragging = false;
      
      const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      
      const rect = btn.getBoundingClientRect();
      offsetX = clientX - rect.left;
      offsetY = clientY - rect.top;
    };

    // Khi người dùng di chuyển (kéo)
    const doDrag = (e) => {
      if (!isPressed) return;
      isDragging = true; // Đánh dấu là hệ thống đang kéo chứ không phải click
      
      const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      
      let newX = clientX - offsetX;
      let newY = clientY - offsetY;
      
      // Giới hạn để nút không bị kéo bay mất
      const maxX = window.innerWidth - btn.offsetWidth;
      const maxY = window.innerHeight - btn.offsetHeight;
      newX = Math.max(0, Math.min(newX, maxX));
      newY = Math.max(0, Math.min(newY, maxY));
      
      btn.style.left = newX + "px";
      btn.style.top = newY + "px";
      btn.style.bottom = "auto"; 
    };

    // Khi người dùng thả tay ra
    const endDrag = () => { 
      // Dùng setTimeout để đảm bảo sự kiện click (nếu có) kịp nhận diện isDragging trước khi reset
      setTimeout(() => { isPressed = false; }, 50); 
    };

    // Bắt sự kiện trên Máy tính (Chuột)
    btn.addEventListener("mousedown", startDrag);
    document.addEventListener("mousemove", doDrag);
    document.addEventListener("mouseup", endDrag);

    // Bắt sự kiện trên Điện thoại (Cảm ứng)
    btn.addEventListener("touchstart", startDrag, { passive: false });
    document.addEventListener("touchmove", (e) => {
      if (isPressed) e.preventDefault();
      doDrag(e);
    }, { passive: false });
    document.addEventListener("touchend", endDrag);

    // ----------------------------------------------------
    // 3. XỬ LÝ CLICK VÀ HỘP THOẠI XÁC NHẬN
    // ----------------------------------------------------
    btn.addEventListener("click", (e) => {
      if (isDragging) {
        // Nếu học sinh đang kéo thả nút -> Hủy lệnh click, không làm gì cả
        e.preventDefault(); 
      } else {
        // Nếu học sinh thực sự bấm (không kéo) -> Hiện thông báo xác nhận
        const xacNhan = confirm("Bạn có chắc chắn muốn quay về Trang chủ?\n\n⚠️ LƯU Ý: Nếu chưa nộp bài, kết quả của bạn sẽ bị mất!");
        
        if (!xacNhan) {
          // Nếu bấm "Hủy" (Cancel) -> Chặn lệnh chuyển trang, tiếp tục ở lại làm bài
          e.preventDefault();
        }
      }
    });
  </script>

</body>
</html>
